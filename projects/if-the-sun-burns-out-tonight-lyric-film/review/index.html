<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b0e">
<title>If The Sun Burns Out Tonight — lyric preview</title>
<style>
:root{color-scheme:dark;--paper:#eef0ec;--sun:#ffda85;--muted:#969d9e;--ink:#090b0e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:var(--paper)}
body{padding:18px 22px;font-family:"Avenir Next",Inter,system-ui,sans-serif}
.shell{max-width:1240px;margin:auto}.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin:0 auto 12px;max-width:1160px}
.identity{min-width:0}.identity h1{font-size:15px;font-weight:600;letter-spacing:.025em;margin:0 0 3px}.identity p{font-size:10px;color:var(--muted);margin:0;letter-spacing:.065em}
.review-state{font-size:9px;color:var(--sun);letter-spacing:.13em;text-transform:uppercase;white-space:nowrap}
.stage-wrap{display:flex;justify-content:center}.stage{position:relative;isolation:isolate;overflow:hidden;container-type:inline-size;width:min(100%,1160px,calc((100svh - 202px)*1920/818));aspect-ratio:1920/818;background:#07090c url('/evidence/source-poster-v4.jpg') center/cover no-repeat}
.stage.portrait{width:min(100%,540px,calc((100svh - 202px)*9/16));aspect-ratio:9/16}
#backdrop{position:absolute;z-index:0;inset:-4%;width:108%;height:108%;filter:blur(14px) brightness(.68);transform:scale(1.04)}
#source{position:absolute;z-index:1;top:0;left:0;width:100%;height:auto;object-fit:contain}
.stage.portrait #source{top:17%;width:100%;height:auto}
#picture{position:absolute;z-index:2;inset:0;width:100%;height:100%;pointer-events:none}
.shade{position:absolute;z-index:3;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 0%,transparent 44%,rgba(7,9,12,.06) 57%,rgba(7,9,12,.32) 77%,rgba(7,9,12,.68) 100%)}
.stage.portrait .shade{background:linear-gradient(180deg,rgba(7,9,12,.03),transparent 38%,rgba(7,9,12,.10) 50%,rgba(7,9,12,.36) 67%,rgba(7,9,12,.56))}
.reading{position:absolute;z-index:4;left:6%;right:6%;bottom:18%;min-height:1.25em;text-align:center;font-family:"Avenir Next Condensed","Avenir Next","Helvetica Neue",Arial,sans-serif;font-size:3.4cqw;font-weight:600;line-height:1.22;letter-spacing:.015em;text-wrap:balance;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.reading.empty{visibility:hidden}.word{color:var(--paper);white-space:nowrap}.word.active{color:var(--sun)}
#sunfire{position:absolute;z-index:4;left:0;top:0;width:1px;height:1px;pointer-events:none;filter:blur(.3px)}.reading{z-index:5}
.word.sunfire-lit{text-shadow:0 2px 8px rgba(0,0,0,.85),0 0 .20em rgba(255,167,45,var(--fire-glow,0))}
#sunbeam{position:absolute;z-index:4;inset:0;width:100%;height:100%;pointer-events:none}
.word.sunbeam-lit{text-shadow:0 2px 8px rgba(0,0,0,.85),0 0 .24em rgba(255,226,157,var(--beam-glow,0))}
#frost{position:absolute;z-index:4;left:0;top:0;width:1px;height:1px;pointer-events:none}
.word.frost-lit{background:linear-gradient(108deg,var(--frost-ice) 0%,var(--frost-ice) var(--frost-front),var(--sun) calc(var(--frost-front) + 18%));background-clip:text;-webkit-background-clip:text;color:transparent;text-shadow:0 0 .12em rgba(184,230,249,var(--frost-glow,0));filter:drop-shadow(0 2px 3px rgba(0,0,0,.88))}
.word.supernova-lit{text-shadow:0 0 .16em rgba(209,166,255,var(--nova-inner,0)),0 0 .43em rgba(154,88,235,var(--nova-outer,0)),0 2px 7px rgba(0,0,0,.88)}
#darkness{position:absolute;z-index:4;left:0;top:0;width:1px;height:1px;pointer-events:none}
.word.darkness-lit{text-shadow:0 2px 8px rgba(0,0,0,.88),var(--dark-x,0em) var(--dark-y,0em) .19em rgba(4,5,13,var(--dark-alpha,0))}
/* Void keeps both treatments: the darkness rule must not replace the halo. */
.word.supernova-lit.darkness-lit{text-shadow:0 0 .16em rgba(209,166,255,var(--nova-inner,0)),0 0 .43em rgba(154,88,235,var(--nova-outer,0)),0 2px 7px rgba(0,0,0,.88),var(--dark-x,0em) var(--dark-y,0em) .19em rgba(4,5,13,var(--dark-alpha,0))}
#damage{position:absolute;z-index:4;left:0;top:0;width:1px;height:1px;pointer-events:none}
.word.damage-lit{background:linear-gradient(119deg,transparent 0% 29%,rgba(90,47,25,var(--damage-cut,0)) 29% 30.4%,transparent 30.4%),linear-gradient(64deg,transparent 0% 57%,rgba(90,47,25,var(--damage-cut,0)) 57% 58.3%,transparent 58.3%),linear-gradient(127deg,transparent 0% 77%,rgba(90,47,25,var(--damage-cut,0)) 77% 78%,transparent 78%),linear-gradient(var(--sun),var(--sun));background-clip:text;-webkit-background-clip:text;color:transparent;text-shadow:0 0 .13em rgba(225,151,95,var(--damage-glow,0));filter:drop-shadow(0 2px 3px rgba(0,0,0,.88))}
#fire-toggle[aria-pressed=true]{color:var(--sun);border-color:#8b774b}
#spectrum{position:absolute;z-index:4;left:15%;bottom:2%;width:70%;height:13.5%;pointer-events:none}
.stage.portrait .reading{left:8%;right:8%;bottom:24%;font-size:6.1cqw;line-height:1.3;letter-spacing:.012em}
.stage.portrait .reading.sunfire-wrap{line-height:1.72}
.stage.portrait #spectrum{left:13%;width:74%;bottom:11%;height:10%}
.error{display:none;position:absolute;z-index:8;left:8%;right:8%;top:40%;padding:14px;background:#1d1415;color:#ffe7da;border:1px solid #76544b;font-size:13px;line-height:1.4}.error.show{display:block}
.controls{max-width:1160px;margin:12px auto 0;display:grid;grid-template-columns:auto auto minmax(80px,1fr) auto auto auto;align-items:center;gap:9px}
button,select,input{font:inherit}button,select{background:#151a20;color:var(--paper);border:1px solid #343a3e;border-radius:3px;padding:7px 10px;font-size:11px}button{cursor:pointer}button:hover,select:hover{border-color:#a08756}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
#play{color:var(--sun);min-width:78px}#seek{width:100%;accent-color:var(--sun)}.clock{font-size:10px;color:#b7bfc0;font-variant-numeric:tabular-nums;white-space:nowrap}.formats{display:flex;gap:5px}.formats button[aria-pressed=true]{color:var(--sun);border-color:#8b774b}
.review-tools{max-width:1160px;margin:10px auto 0;display:flex;align-items:center;gap:8px}.review-tools label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}#cue{min-width:0;max-width:520px;flex:1}.spacer{flex:1}#recover{color:#bac1c1;background:transparent}
.below{max-width:1160px;margin:10px auto 0;color:var(--muted);font-size:10px;line-height:1.4;display:flex;justify-content:space-between;gap:12px}.below strong{color:#cbd1cf;font-weight:500}
@media(max-width:640px){body{padding:12px 10px}.identity h1{font-size:12px}.identity p{font-size:8px}.review-state{font-size:8px}.masthead{gap:8px}.controls{grid-template-columns:auto auto minmax(70px,1fr) auto;gap:6px}.speed{grid-column:1/3}.formats{grid-column:3/5;justify-content:flex-end}.stage{width:100%}.stage.portrait{width:min(100%,calc((100svh - 255px)*9/16))}.review-tools{flex-wrap:wrap;gap:6px}.review-tools label{display:none}.review-tools .spacer{display:none}#cue{max-width:none}#recover{font-size:10px}.below{font-size:9px}.below span:last-child{display:none}}
</style>
</head>
<body>
<main class="shell">
<header class="masthead"><div class="identity"><h1>If The Sun Burns Out Tonight</h1><p>Grabbitz · Oli Sykes · Courtney LaPlante</p></div><span class="review-state">Lyric film · preview</span></header>
<div class="stage-wrap"><section class="stage" id="stage" aria-label="Full music video lyric preview">
<canvas id="backdrop" aria-hidden="true"></canvas>
<video id="source" playsinline preload="auto" poster="/evidence/source-poster-v4.jpg"><source src="/public/source.mp4" type="video/mp4"></video>
<canvas id="picture" aria-hidden="true"></canvas><div class="shade" aria-hidden="true"></div>
<canvas id="sunfire" aria-hidden="true"></canvas><canvas id="sunbeam" aria-hidden="true" hidden></canvas><canvas id="frost" aria-hidden="true" hidden></canvas><canvas id="darkness" aria-hidden="true" hidden></canvas><canvas id="damage" aria-hidden="true" hidden></canvas><div class="reading empty" id="reading" aria-live="off"></div><canvas id="spectrum" aria-hidden="true"></canvas>
<div id="error" class="error" role="alert"></div>
</section></div>
<nav class="controls" aria-label="Preview controls">
<button id="play" aria-label="Play or pause" type="button">▶ Play</button><button id="restart" type="button" aria-label="Restart song">↤ Start</button>
<input id="seek" type="range" min="0" max="234.266122" step="0.01" value="0" aria-label="Seek through the full song"><span id="clock" class="clock">0:00 / 3:54</span>
<select id="speed" class="speed" aria-label="Playback speed"><option value="1">1×</option><option value="0.75">0.75×</option><option value="0.5">0.5×</option></select>
<div class="formats" role="group" aria-label="Preview aspect ratio"><button id="landscape" type="button" aria-label="Original video aspect ratio" aria-pressed="true">Original</button><button id="portrait" type="button" aria-pressed="false">9:16</button></div>
</nav>
<div class="review-tools"><label for="cue">Jump to lyric</label><select id="cue" aria-label="Select a lyric line"></select><span class="spacer"></span><button id="fire-toggle" type="button" aria-label="Sunfire lyric effect" aria-pressed="true">Sunfire on</button><button id="mute" type="button" aria-label="Mute soundtrack" aria-pressed="false">Sound on</button><button id="recover" type="button">Restore picture</button></div>
<footer class="below"><span><strong>Complete original video and soundtrack.</strong> Word timing under review.</span><span>Preview only · no production render</span></footer>
<output id="preview-state" hidden></output>
</main><script type="module" src="/src/player.js"></script>
</body>
</html>
