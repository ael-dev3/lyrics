<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#231c23">
<title>I'll Change for You — full lyric preview</title>
<style>
:root{color-scheme:dark;--paper:#f4e9de;--muted:#a79a99;--rose:#f3bbaf;--ground:#231c23}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ground);color:var(--paper)}
body{padding:15px 20px 18px;font-family:"Avenir Next",system-ui,sans-serif}
.shell{max-width:1040px;margin:auto}
.masthead{display:flex;align-items:end;justify-content:space-between;gap:16px;max-width:820px;margin:0 auto 12px}
.identity h1{font-size:16px;font-weight:550;letter-spacing:.01em;margin:0 0 3px}.identity p{font-size:10px;color:var(--muted);margin:0}
.tag{color:#dcbcaf;font-size:9px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.stage-wrap{display:flex;justify-content:center}
.stage{position:relative;overflow:hidden;isolation:isolate;container-type:inline-size;width:min(100%,820px,calc((100svh - 191px)*4/3));aspect-ratio:4/3;background:#452b33 url('/public/source-poster.jpg') center/cover no-repeat}
.stage.portrait{width:min(100%,480px,max(310px,calc((100svh - 200px)*9/16)));aspect-ratio:9/16;background:#32232c}
#backdrop{display:none;position:absolute;z-index:0;inset:-4%;width:108%;height:108%;filter:blur(23px) brightness(.39) saturate(.82);transform:scale(1.035)}
.stage.portrait #backdrop{display:block}
#source{position:absolute;z-index:1;inset:0;width:100%;height:100%;object-fit:contain}
.stage.portrait #source{top:15%;bottom:auto;height:auto;aspect-ratio:4/3;object-fit:contain}
.portrait-frame{display:none;position:absolute;z-index:2;left:0;right:0;top:15%;height:42.1875%;pointer-events:none;border-top:1px solid rgba(244,233,222,.25);border-bottom:1px solid rgba(244,233,222,.25)}
.stage.portrait .portrait-frame{display:block}
.shade{position:absolute;z-index:2;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 46%,rgba(24,17,24,.02) 59%,rgba(24,17,24,.18) 75%,rgba(24,17,24,.48) 100%)}
.stage[data-tone=light]:not(.portrait) .shade{background:linear-gradient(180deg,transparent 48%,rgba(250,242,226,.03) 62%,rgba(250,242,226,.24) 80%,rgba(250,242,226,.52) 100%)}
.stage.portrait .shade{background:linear-gradient(180deg,rgba(20,15,21,.10),transparent 43%,rgba(25,17,25,.32) 59%,rgba(25,17,25,.46) 100%)}
#edgeprint{position:absolute;z-index:3;left:1.8%;top:9%;width:4.2%;height:68%;pointer-events:none}
.stage.portrait #edgeprint{left:1.3%;top:17%;width:4.8%;height:37%}
.reading{position:absolute;z-index:4;left:7%;right:7%;bottom:12%;min-height:1.2em;text-align:center;font-family:"Iowan Old Style",Baskerville,Georgia,serif;font-size:4.25cqw;font-weight:600;line-height:1.20;letter-spacing:-.018em;text-wrap:balance;color:var(--paper);text-shadow:0 1px 3px rgba(20,10,19,.95),0 3px 13px rgba(20,10,19,.9),1px 0 1px rgba(20,10,19,.7)}
.reading.empty{visibility:hidden}
.word{position:relative;color:inherit;white-space:nowrap}
.word.active{color:var(--rose)}
.stage[data-tone=light]:not(.portrait) .reading{color:#241c23;text-shadow:0 1px 1px rgba(255,249,239,.95),0 0 9px rgba(255,248,233,.87)}
.stage[data-tone=light]:not(.portrait) .word.active{color:#992d47;text-shadow:0 1px 1px rgba(255,249,239,.95),0 0 7px rgba(255,248,233,.8)}
.word.change.active::after{content:attr(data-ink);position:absolute;left:0;top:0;color:var(--rose);opacity:var(--ghost,.0);transform:translate(var(--ghost-x,0px),var(--ghost-y,0px));filter:blur(.035em);pointer-events:none}
.stage[data-tone=light]:not(.portrait) .word.change.active::after{color:#992d47}
.stage.portrait .reading{left:8%;right:8%;bottom:22%;font-size:6.0cqw;line-height:1.21}
.error{display:none;position:absolute;z-index:8;left:8%;right:8%;top:59%;padding:11px 13px;background:rgba(46,20,33,.94);border:1px solid #bb8e88;color:#fff0e7;font-size:12px;line-height:1.4}
.error.show{display:block}
.controls{max-width:820px;margin:12px auto 0;display:grid;grid-template-columns:auto auto minmax(120px,1fr) auto auto auto;gap:8px;align-items:center}
button,select,input{font:inherit}button,select{padding:7px 9px;border:1px solid #64565c;border-radius:2px;background:#342b34;color:var(--paper);font-size:11px}button{cursor:pointer}button:hover,select:hover{border-color:#dfb4a4}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #f1c5a8;outline-offset:2px}
#play{color:#f3c9b5;min-width:73px}#seek{width:100%;accent-color:#e9a89b}.clock{font-size:10px;color:#cbbfbb;white-space:nowrap;font-variant-numeric:tabular-nums}
.formats{display:flex;gap:5px}.formats button[aria-pressed=true],#ink[aria-pressed=true]{color:#f4c9b7;border-color:#c49990}
.review-tools{max-width:820px;margin:9px auto 0;display:flex;align-items:center;gap:8px}.review-tools label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}#cue{flex:1;min-width:0;max-width:500px}.spacer{flex:1}#recover{background:transparent}
.below{max-width:820px;margin:8px auto 0;display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:10px;line-height:1.35}.below strong{font-weight:500;color:#ded3cd}
@media(max-width:660px){body{padding:10px}.identity h1{font-size:13px}.identity p{font-size:9px}.tag{font-size:8px}.stage{width:100%}.stage.portrait{width:min(100%,480px,max(310px,calc((100svh - 200px)*9/16)))}.controls{grid-template-columns:auto auto minmax(90px,1fr) auto;gap:5px}.speed{grid-column:1/3}.formats{grid-column:3/5;justify-content:flex-end}.review-tools{flex-wrap:wrap;gap:6px}.review-tools label,.review-tools .spacer{display:none}#cue{max-width:none;flex-basis:45%}.below span:last-child{display:none}}
</style>
</head>
<body><main class="shell">
<header class="masthead"><div class="identity"><h1>I'll Change for You</h1><p>Mitski · original 4:3 film</p></div><div class="tag">Complete lyric preview</div></header>
<div class="stage-wrap"><section class="stage" id="stage" data-tone="dark" aria-label="Complete music video lyric preview">
<canvas id="backdrop" aria-hidden="true"></canvas>
<video id="source" playsinline preload="auto" poster="/public/source-poster.jpg"><source src="/public/source.mp4" type="video/mp4"></video>
<div class="portrait-frame" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div>
<canvas id="edgeprint" aria-hidden="true"></canvas><div id="reading" class="reading empty" aria-live="off"></div>
<div id="error" class="error" role="alert"></div>
</section></div>
<nav class="controls" aria-label="Preview controls">
<button id="play" type="button">▶ Play</button><button id="restart" type="button">↤ Start</button>
<input id="seek" type="range" min="0" max="196.464036" step="0.01" value="0" aria-label="Seek through the full song">
<span id="clock" class="clock">0:00 / 3:16</span>
<select id="speed" class="speed" aria-label="Playback speed"><option value="1">1×</option><option value="0.75">0.75×</option><option value="0.5">0.5×</option></select>
<div class="formats" role="group" aria-label="Preview format"><button id="landscape" type="button" aria-pressed="true">Original 4:3</button><button id="portrait" type="button" aria-pressed="false">9:16</button></div>
</nav>
<div class="review-tools"><label for="cue">Jump to line</label><select id="cue" aria-label="Jump to lyric line"></select><span class="spacer"></span><button id="ink" type="button" aria-pressed="true">Edge print on</button><button id="mute" type="button" aria-pressed="true">Sound on</button><button id="recover" type="button">Restore picture</button></div>
<footer class="below"><span><strong>Complete source film and soundtrack.</strong> Word timing awaits full listening review.</span><span>Preview only · full render requires approval</span></footer>
<output id="preview-state" hidden></output>
</main><script type="module" src="/src/player.js"></script></body></html>
